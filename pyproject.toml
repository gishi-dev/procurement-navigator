[project]
name = "procurement-navigator"
version = "0.1.0"
description = "架空の仕入先をブラウザで調べる調達アシスタント"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.28", "playwright>=1.49"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]

[tool.ruff]
line-length = 110
target-version = "py313"
